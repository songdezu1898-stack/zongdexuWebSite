index index.html;
server_tokens off;
charset utf-8;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

client_max_body_size 1m;

location / {
    try_files $uri $uri/ =404;
}

location ~ /\.(?!well-known(?:/|$)) {
    deny all;
}

location = /data/live-qa.json {
    add_header Cache-Control "no-store";
}

location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
}
